services:
  postgres:
    image: postgres:16-alpine
    container_name: karyoai_postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=karyoai
      - POSTGRES_PASSWORD=karyoai_secure_password
      - POSTGRES_DB=karyoai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karyoai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karyoai-network

  redis:
    image: redis:7-alpine
    container_name: karyoai_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - karyoai-network

  ollama:
    image: ollama/ollama:latest
    container_name: karyoai_ollama
    ports:
      - "18080:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=30m
    restart: unless-stopped
    networks:
      - karyoai-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        pid=$$!
        sleep 10
        ollama pull llama3.2:latest
        wait $$pid

  chromadb:
    image: chromadb/chroma:1.5.8
    container_name: karyoai_chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    restart: unless-stopped
    networks:
      - karyoai-network

  backend:
    build: ./backend
    container_name: karyoai_backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://karyoai:karyoai_secure_password@postgres:5432/karyoai
      - REDIS_URL=redis://redis:6379
      - INTERNAL_SERVICE_TOKEN=karyoai_internal_secure_token
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - karyoai-network

  worker:
    build: ./backend
    container_name: karyoai_worker
    command: ["node", "dist/workers/ingestionWorker.js"]
    environment:
      - DATABASE_URL=postgresql://karyoai:karyoai_secure_password@postgres:5432/karyoai
      - REDIS_URL=redis://redis:6379
      - FASTAPI_URL=http://llm-service:8000/internal/documents/ingest
      - INTERNAL_SERVICE_TOKEN=karyoai_internal_secure_token
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
      - llm-service
    networks:
      - karyoai-network

  llm-service:
    build: ./llm-service
    container_name: karyoai_llm-service
    ports:
      - "8002:8000"
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://ollama:11434
      - INTERNAL_SERVICE_TOKEN=karyoai_internal_secure_token
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - chromadb
      - ollama
    networks:
      - karyoai-network

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  ollama_data:
    driver: local

networks:
  karyoai-network:
    driver: bridge